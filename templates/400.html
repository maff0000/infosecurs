<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bad request — Infosecurs</title>
<style>
  :root { --color-bg:#f4f6f8; --color-surface:#ffffff; --color-border:#d7dde3; --color-text:#1c2430; --color-text-muted:#5b6b7a; --color-primary:#185ea8; }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:var(--color-bg); color:var(--color-text); font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; font-size:16px; line-height:1.5; }
  main { max-width:560px; margin:15vh auto 0 auto; padding:0 16px 40px 16px; }
  .error-card { background:var(--color-surface); border:1px solid var(--color-border); border-radius:6px; padding:32px; }
  h1 { font-size:1.4rem; margin:0 0 12px 0; }
  p { margin:0 0 16px 0; color:var(--color-text-muted); }
  a { color:var(--color-primary); }
  a:focus-visible { outline:3px solid var(--color-primary); outline-offset:2px; }
</style>
</head>
<body>
<main id="main-content">
  <div class="error-card">
    <h1>We couldn't process that request</h1>
    <p>The request looked malformed or couldn't be understood. Please go back and try again.</p>
    <p><a href="/">Return to Infosecurs</a></p>
  </div>
</main>
</body>
</html>
