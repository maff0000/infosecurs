{% extends "base.html" %}

{% block title %}Log in — {{ product_name }}{% endblock %}

{% block content %}
<div class="auth-card">
    <h1>Log in to {{ product_name }}</h1>
    {% if form.errors %}
        <p class="form-error" role="alert">Your username and password didn't match. Please try again.</p>
    {% endif %}
    <form method="post" action="{% url 'login' %}" novalidate>
        {% csrf_token %}
        <div class="field">
            <label for="id_username">Username</label>
            <input type="text" name="username" id="id_username" autofocus required autocapitalize="none" autocomplete="username">
        </div>
        <div class="field">
            <label for="id_password">Password</label>
            <input type="password" name="password" id="id_password" required autocomplete="current-password">
        </div>
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit" class="button button--primary">Log in</button>
    </form>
</div>
{% endblock %}
