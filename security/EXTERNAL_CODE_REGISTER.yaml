# Infosecurs — external software register
# Author: Hermes (Project Architect). Date: 2026-11-19.
# Built from the repository at main 6b4cb6ca5d580ef3d0a36567da47e63c93a776de.
# Being listed here is not approval to use a component.
project: infosecurs
register_version: 1
inventory_status: incomplete_first_pass_on_an_existing_product
coverage:
  inspected:
    - "requirements.in, requirements-dev.in and both hash-pinned lock files (every pinned package is listed below)"
    - "Dockerfile and the three docker-compose files (base and service images)"
    - ".github/workflows/ci.yml and security.yml (pinned Actions and tools)"
    - "static/ and templates (searched for vendored scripts, fonts and CDN links; none found: four first-party static files)"
    - "source tree searched for 'copied from', 'vendored', 'adapted from', SPDX and copyright markers; no copied third-party code found"
  not_inspected:
    - "Debian packages inside the Python base image, other than the seven the Dockerfile pins"
    - "Contents of the ClamAV and PostgreSQL images, beyond the Trivy scan run in CI"
    - "Chromium and its system libraries installed on the CI runner by 'playwright install --with-deps chromium'"
    - "The AI gateway (LiteLLM) and the models behind it: reached over the network, not incorporated, configured outside this repository"
    - "Whether any first-party file was copied from an unmarked external source"
  known_gaps:
    - "No software bill of materials is generated."
    - "pip-audit runs on requirements.txt only. The dev-only packages are checked only by the Trivy scan of the built image."
    - "No LICENSE or NOTICE file exists in the repository."
    - "Licences below are what each package declares on PyPI for the exact version, fetched 2026-11-19. Nobody has reviewed them for compatibility with how Infosecurs will be distributed."
    - "psycopg and psycopg-binary declare LGPL-3.0-only. Not assessed."
    - "The Dockerfile installs requirements-dev.txt, so the test-only packages are present in the built image. Whether that is intended is unknown (PRODUCT-BACKLOG.md, PBI-005)."
approval:
  status: not_individually_approved_under_FOUNDRY
  note: >-
    These components were incorporated under the previous delivery chain
    (docs/adr/ADR-0001-APPLICATION-STACK.md, docs/delivery/BUILD-REPRODUCIBILITY.md)
    before the project came under FOUNDRY. The Architect has not re-approved
    them one by one. Three were changed on 2026-11-19 with evidence in
    docs/evidence/SECURITY-REMEDIATION-2026-11-19.md: oauthlib, pypdf and the
    ClamAV image digest.
security_evidence:
  - "security/dependencies (pip-audit 2.10.1 on requirements.txt), required check, green on the baseline commit"
  - "security/container (Trivy, CRITICAL and HIGH, on the built image and the ClamAV image), required check, green on the baseline commit"
  - "security/secrets (gitleaks) and security/sast, required checks; CodeQL also runs"
  - "All Python packages are installed with --require-hashes."
rule_for_changes: >-
  Adding, removing or changing the version of anything below needs Architect
  approval in the Work Order and an update to this register in the same
  change. Follow docs/delivery/BUILD-REPRODUCIBILITY.md.

