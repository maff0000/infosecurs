name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DJANGO_ENV: test
  DJANGO_SECRET_KEY: ci-only-secret-key-not-for-production-use
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
  POSTGRES_DB: infosecurs_test
  POSTGRES_USER: infosecurs
  POSTGRES_PASSWORD: ci-only-password-not-for-production
  POSTGRES_HOST: localhost
  POSTGRES_PORT: 5432

jobs:
  unit:
    name: ci/unit
    # Explicit runner generation, not the floating `ubuntu-latest` alias -
    # see docs/delivery/BUILD-REPRODUCIBILITY.md.
    runs-on: ubuntu-24.04
    services:
      postgres:
        # Pinned by explicit version + immutable digest, kept identical to
        # docker-compose.yml.
        image: postgres:16.6-alpine@sha256:1d04b9ba1d4996401f2552b51beda8187f175c0645c091e4781134fc9c9a3eef
        env:
          POSTGRES_DB: infosecurs_test
          POSTGRES_USER: infosecurs
          POSTGRES_PASSWORD: ci-only-password-not-for-production
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U infosecurs -d infosecurs_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.14"

      # Locked graph only - no floating "latest of whatever's on PyPI today".
      - run: pip install --no-cache-dir --require-hashes -r requirements-dev.txt

      - name: Domain / model tests
        run: >
          pytest -v
          organisations/tests/test_models.py
          organisations/tests/test_persistence.py
          organisations/tests/test_bootstrap.py
          security_baseline/tests/test_models.py
          security_baseline/tests/test_services.py
          key_assets/tests/test_models.py
          key_assets/tests/test_suggestions.py
          key_assets/tests/test_protection_checks.py
          risk_register/tests/test_models.py
          risk_register/tests/test_methodology.py
          evidence/tests/test_models.py
          evidence/tests/test_storage.py
          remediation/tests/test_models.py
          activity/tests/test_models.py
          security_state/tests/test_services.py
          governance/tests/test_models.py
          governance/tests/test_services.py
          workplace/tests/test_models.py
          workplace/tests/test_services.py
          policy/tests/test_models.py
          policy/tests/test_grounding.py
          policy/tests/test_services.py
          policy/tests/test_pdf_rendering.py

  integration:
    name: ci/integration
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.6-alpine@sha256:1d04b9ba1d4996401f2552b51beda8187f175c0645c091e4781134fc9c9a3eef
        env:
          POSTGRES_DB: infosecurs_test
          POSTGRES_USER: infosecurs
          POSTGRES_PASSWORD: ci-only-password-not-for-production
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U infosecurs -d infosecurs_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.14"

      - run: pip install --no-cache-dir --require-hashes -r requirements-dev.txt

      - name: Bootstrap - clean database migrates successfully
        run: python manage.py migrate --noinput

      - name: HTTP / auth / tenant-isolation / AI-adapter tests
        run: >
          pytest -v
          organisations/tests/test_auth.py
          organisations/tests/test_tenant_isolation.py
          organisations/tests/test_http_ui.py
          core/tests/
          security_baseline/tests/test_auth.py
          security_baseline/tests/test_http_ui.py
          security_baseline/tests/test_tenant_isolation.py
          key_assets/tests/test_http_ui.py
          key_assets/tests/test_tenant_isolation.py
          key_assets/tests/test_detail_view.py
          ai_platform/tests/
          risk_register/tests/test_grounding.py
          risk_register/tests/test_services.py
          risk_register/tests/test_http_ui.py
          risk_register/tests/test_tenant_isolation.py
          risk_register/tests/test_eval_harness.py
          risk_register/tests/test_eval_command.py
          risk_register/tests/test_interpretation_service.py
          risk_register/tests/test_interpretation_views.py
          risk_register/tests/test_learning_signal_capture.py
          evidence/tests/test_services.py
          evidence/tests/test_views.py
          evidence/tests/test_tenant_isolation.py
          evidence/tests/test_link_services.py
          remediation/tests/test_http_ui.py
          remediation/tests/test_no_cascade_on_completion.py
          remediation/tests/test_tenant_isolation.py
          remediation/tests/test_action_evidence_link.py
          activity/tests/test_services.py
          activity/tests/test_http_ui.py
          activity/tests/test_tenant_isolation.py
          security_state/tests/test_views.py
          security_state/tests/test_tenant_isolation.py
          governance/tests/test_tenant_isolation.py
          governance/tests/test_views.py
          workplace/tests/test_http_ui.py
          workplace/tests/test_tenant_isolation.py
          identity/tests/test_federated_login.py
          identity/tests/test_unsafe_linking.py
          policy/tests/test_http_ui.py
          policy/tests/test_tenant_isolation.py
          policy/tests/test_edit.py
          policy/tests/test_approval.py
          policy/tests/test_download.py
          policy/tests/test_eval_harness.py
          policy/tests/test_eval_command.py
