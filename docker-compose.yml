# Normal local development stack - `web` binds the working tree at `.:/app`
# and runs the plain dev server, on purpose (fast edit/reload loop).
#
# This is NOT the release-artifact proof. For an immutable, SHA-bound image
# with no source bind (M006 PID §15), see the separate, standalone
# docker-compose.release.yml and docs/runbooks/BETA-OPERATIONS.md's
# "Release artifact" section - deliberately not merged with this file (see
# docker-compose.release.yml's header comment for why).
services:
  db:
    # Pinned by explicit version + immutable digest, kept identical to CI
    # (see .github/workflows/ci.yml and docs/delivery/BUILD-REPRODUCIBILITY.md).
    image: postgres:16.6-alpine@sha256:1d04b9ba1d4996401f2552b51beda8187f175c0645c091e4781134fc9c9a3eef
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - infosecurs_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"

  # M009A (WO-M009A-SECURE-INGESTION-XLSX.md "Scanner deployment shape -
  # frozen", Final Correction B). Internal-only Compose service - NO
  # `ports:` mapping anywhere in this file, reachable solely over the
  # default internal Compose network by `web` (questionnaire.scanner).
  # Exact version + immutable digest pinned (never a floating `latest`
  # tag). FreshClam (signature updates) runs via this official image's own
  # entrypoint; the signature database lives on its OWN named volume -
  # operational/cache data, never INFOSECURS business data, so it is
  # deliberately NOT included in scripts/backup.sh's backup set.
  clamav:
    image: clamav/clamav:1.4.4@sha256:a52f45e42753dca691b6c9fd09fe68d6ca9ac22fa8cd6a8a45d9237e188049e3
    volumes:
      - infosecurs_clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

  web:
    build: .
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      # Persistent, Docker-mounted path external to the application image
      # (M003 PID §9/§21) - evidence bytes must outlive/be independent of
      # any image rebuild, and must never be served from a public
      # static/media directory.
      EVIDENCE_STORAGE_ROOT: /data/evidence
      # M009A: same discipline, same reasoning, a SEPARATE storage root
      # from evidence (WO-M009A "Questionnaire storage - persistent and
      # recoverable").
      QUESTIONNAIRE_STORAGE_ROOT: /data/questionnaire
      # M009A: the internal-only clamav service above, reached by its
      # Compose service name over the internal network - never a host
      # port, never an external/cloud scanner.
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
    volumes:
      - .:/app
      - infosecurs_evidence_data:/data/evidence
      - infosecurs_questionnaire_data:/data/questionnaire
    ports:
      # Configurable host bind address (default stays loopback-only - a
      # normal clone is never reachable off the host unless someone
      # deliberately sets WEB_BIND_ADDRESS in their own local, gitignored
      # .env). Never hard-code a real LAN address here - see .env.example's
      # own comment on this variable.
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_HOST_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      clamav:
        condition: service_healthy

volumes:
  infosecurs_postgres_data:
  infosecurs_evidence_data:
  infosecurs_questionnaire_data:
  infosecurs_clamav_data:
